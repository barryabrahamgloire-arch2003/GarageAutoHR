<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Lecture des avis — Garage Auto HR Conakry</title>
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#0D141C; --red:#A03B2E; --cream:#F1E8D5; --card:#FBFAF8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: var(--ink); color: var(--cream); font-family: Archivo, system-ui, sans-serif; }
    main { width: min(860px, calc(100% - 32px)); margin: 48px auto 72px; }
    .brand img { width: 72px; height: 72px; object-fit: contain; }
    h1 { font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; font-size: clamp(2rem, 6vw, 3.2rem); line-height: .95; margin: 18px 0 12px; }
    form, article { background: var(--card); color: var(--ink); border-radius: 22px; padding: 18px; }
    form { display: flex; gap: 10px; margin: 18px 0 22px; }
    input { flex: 1; border: 1px solid #e4ddd4; border-radius: 12px; padding: 12px 14px; font: inherit; }
    button { border: 0; border-radius: 999px; background: var(--red); color: white; font: inherit; font-weight: 700; padding: 12px 18px; cursor: pointer; }
    .note { color: #e7b2ad; min-height: 1.2em; }
    article { margin: 12px 0; }
    article h2 { margin: 0 0 6px; font-size: 1.15rem; }
    .scores { display: grid; gap: 4px; margin: 10px 0; color: #5c564f; font-size: .95rem; }
    .when { color: #8a8178; font-size: .82rem; }
    @media (max-width: 640px) { form { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/logo.png" alt=""></div>
    <h1>Les avis</h1>
    <form id="gate">
      <input name="code" type="password" autocomplete="current-password" placeholder="Code" required>
      <button type="submit">Voir</button>
    </form>
    <p class="note" id="note"></p>
    <div id="list"></div>
  </main>
  <script>
    const QUESTIONS = [
      "L’accueil et l’écoute",
      "La qualité du diagnostic et de la réparation",
      "Le respect des délais annoncés",
      "La clarté du devis et la confiance"
    ];
    document.getElementById("gate").addEventListener("submit", async (event) => {
      event.preventDefault();
      const note = document.getElementById("note");
      const list = document.getElementById("list");
      note.textContent = "Lecture…";
      list.innerHTML = "";
      const response = await fetch("https://garage-auto-hr.vercel.app/api/avis/voir", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: event.currentTarget.code.value })
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        note.textContent = body.error || "Code incorrect.";
        return;
      }
      const avis = body.avis || [];
      note.textContent = avis.length ? avis.length + " avis" : "Aucun avis pour le moment.";
      list.innerHTML = avis.map((item) => {
        const scores = QUESTIONS.map((question, index) => "<div>" + question + " · " + (item.scores[index] || "–") + "/5</div>").join("");
        const when = new Date(item.createdAt).toLocaleString("fr-FR");
        return "<article><p class='when'>" + when + "</p><h2>" + escapeHtml(item.name) + "</h2><div class='scores'>" + scores + "</div><p>" + escapeHtml(item.comment) + "</p></article>";
      }).join("");
    });
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
  </script>
</body>
</html>
